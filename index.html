<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Träningslogg</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222e;
      --border: #2e2e3e;
      --accent: #6c63ff;
      --accent-dim: #3d3880;
      --accent-hover: #7d75ff;
      --text: #e8e8f0;
      --text-muted: #888899;
      --danger: #ff4d6d;
      --green: #3ecf8e;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* ── BUTTONS ── */
    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      border-radius: var(--radius);
      transition: background 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      padding: 10px 20px;
      font-weight: 600;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text-muted);
      padding: 8px 14px;
    }

    .btn-ghost:hover { background: var(--border); color: var(--text); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      padding: 6px 10px;
      font-size: 0.8rem;
      border: 1px solid #ff4d6d44;
    }

    .btn-danger:hover { background: #ff4d6d22; }

    .btn-icon {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .btn-icon:hover { background: var(--accent); color: #fff; }

    /* ── INPUTS ── */
    input[type="text"], input[type="number"], input[type="date"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 9px 12px;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text-muted); }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-header h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* ── NEW SESSION FORM ── */
    #new-session-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 28px;
    }

    #new-session-area h2 {
      font-size: 1.05rem;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .form-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .form-row .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 140px;
    }

    .form-row label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ── ACTIVE SESSION ── */
    #active-session {
      background: var(--surface);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 28px;
    }

    #active-session .session-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    #active-session .session-title-row h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    #active-session .session-title-row span {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Exercise card in active session */
    .exercise-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .exercise-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .exercise-card-header span {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .sets-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .sets-table th {
      text-align: left;
      color: var(--text-muted);
      font-weight: 500;
      padding: 4px 8px 8px;
    }

    .sets-table td {
      padding: 4px 8px;
      vertical-align: middle;
    }

    .sets-table td input {
      width: 70px;
      padding: 6px 8px;
      text-align: center;
    }

    .set-row td:first-child {
      color: var(--text-muted);
      font-size: 0.8rem;
      width: 40px;
    }

    .add-set-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    /* Add exercise row */
    .add-exercise-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      align-items: flex-end;
    }

    .add-exercise-row input { flex: 1; }

    .session-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      justify-content: flex-end;
    }

    /* ── HISTORY ── */
    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }

    .history-item-header:hover { background: var(--surface2); }

    .history-item-header .left h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .history-item-header .left span {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
      display: block;
    }

    .history-item-header .right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chevron {
      color: var(--text-muted);
      font-size: 0.7rem;
      transition: transform 0.2s;
    }

    .history-item.open .chevron { transform: rotate(180deg); }

    .history-body {
      display: none;
      padding: 0 18px 14px;
      border-top: 1px solid var(--border);
    }

    .history-item.open .history-body { display: block; }

    .history-exercise {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .history-exercise:last-child { border-bottom: none; }

    .history-exercise-name {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .history-sets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .set-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .set-pill strong { color: var(--text); }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty span { font-size: 2.5rem; display: block; margin-bottom: 10px; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--green);
      color: #0a2e1f;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 10px 20px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 999;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      .sets-table td input { width: 55px; }
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Träningslogg</h1>
    <p>Logga dina pass, övningar och set</p>
  </header>

  <!-- NEW SESSION FORM -->
  <div id="new-session-area">
    <h2>Nytt träningspass</h2>
    <div class="form-row">
      <div class="field">
        <label for="session-name">Passnamn</label>
        <input type="text" id="session-name" placeholder="t.ex. Bröst & triceps" />
      </div>
      <div class="field" style="flex:0; min-width:150px;">
        <label for="session-date">Datum</label>
        <input type="date" id="session-date" />
      </div>
      <button class="btn-primary" id="start-btn" style="white-space:nowrap; height:38px; margin-top:auto;">
        Starta pass
      </button>
    </div>
  </div>

  <!-- ACTIVE SESSION -->
  <div id="active-session" style="display:none;">
    <div class="session-title-row">
      <div>
        <h2 id="active-title">Pass</h2>
        <span id="active-date"></span>
      </div>
      <span style="background:#6c63ff22; color:var(--accent); padding:4px 10px; border-radius:20px; font-size:0.78rem; font-weight:600;">● Pågående</span>
    </div>

    <div id="exercises-container"></div>

    <div class="add-exercise-row">
      <input type="text" id="exercise-input" placeholder="Lägg till övning (t.ex. Bänkpress)" />
      <button class="btn-icon" id="add-exercise-btn">+ Övning</button>
    </div>

    <div class="session-actions">
      <button class="btn-ghost" id="cancel-session-btn">Avbryt</button>
      <button class="btn-primary" id="save-session-btn">Spara pass</button>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="section-header">
    <h2>Tidigare pass</h2>
    <span id="history-count" style="font-size:0.82rem; color:var(--text-muted);"></span>
  </div>
  <div id="history-list"></div>
</div>

<div id="toast"></div>

<script>
// ─── STATE ───────────────────────────────────────────────
const STORAGE_KEY = 'traningslogg_v1';

let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let activeSession = null; // { name, date, exercises: [{ name, sets: [{ reps, weight }] }] }

// ─── DOM REFS ────────────────────────────────────────────
const sessionNameInput = document.getElementById('session-name');
const sessionDateInput = document.getElementById('session-date');
const startBtn         = document.getElementById('start-btn');
const activeDiv        = document.getElementById('active-session');
const newSessionDiv    = document.getElementById('new-session-area');
const activeTitle      = document.getElementById('active-title');
const activeDateEl     = document.getElementById('active-date');
const exercisesContainer = document.getElementById('exercises-container');
const exerciseInput    = document.getElementById('exercise-input');
const addExerciseBtn   = document.getElementById('add-exercise-btn');
const saveSessionBtn   = document.getElementById('save-session-btn');
const cancelSessionBtn = document.getElementById('cancel-session-btn');
const historyList      = document.getElementById('history-list');
const historyCount     = document.getElementById('history-count');
const toast            = document.getElementById('toast');

// ─── INIT ────────────────────────────────────────────────
sessionDateInput.value = todayStr();
renderHistory();

// ─── EVENT LISTENERS ────────────────────────────────────
startBtn.addEventListener('click', startSession);
addExerciseBtn.addEventListener('click', addExercise);
saveSessionBtn.addEventListener('click', saveSession);
cancelSessionBtn.addEventListener('click', cancelSession);

exerciseInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') addExercise();
});

// ─── FUNCTIONS ───────────────────────────────────────────
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function formatDate(str) {
  if (!str) return '';
  const [y, m, d] = str.split('-');
  return `${d}/${m}/${y}`;
}

function startSession() {
  const name = sessionNameInput.value.trim() || 'Pass';
  const date = sessionDateInput.value || todayStr();
  activeSession = { name, date, exercises: [] };
  activeTitle.textContent = name;
  activeDateEl.textContent = formatDate(date);
  renderExercises();
  newSessionDiv.style.display = 'none';
  activeDiv.style.display = 'block';
  exerciseInput.focus();
}

function cancelSession() {
  activeSession = null;
  activeDiv.style.display = 'none';
  newSessionDiv.style.display = 'block';
  sessionNameInput.value = '';
  sessionDateInput.value = todayStr();
}

function addExercise() {
  const name = exerciseInput.value.trim();
  if (!name) return;
  activeSession.exercises.push({ name, sets: [] });
  exerciseInput.value = '';
  renderExercises();
  exerciseInput.focus();
}

function addSet(exIdx) {
  const repsInput  = document.getElementById(`reps-${exIdx}`);
  const weightInput = document.getElementById(`weight-${exIdx}`);
  const reps   = parseInt(repsInput.value)   || 0;
  const weight = parseFloat(weightInput.value) || 0;
  activeSession.exercises[exIdx].sets.push({ reps, weight });
  repsInput.value = '';
  weightInput.value = '';
  renderExercises();
  // Re-focus reps input for this exercise
  const el = document.getElementById(`reps-${exIdx}`);
  if (el) el.focus();
}

function removeSet(exIdx, setIdx) {
  activeSession.exercises[exIdx].sets.splice(setIdx, 1);
  renderExercises();
}

function removeExercise(exIdx) {
  activeSession.exercises.splice(exIdx, 1);
  renderExercises();
}

function renderExercises() {
  exercisesContainer.innerHTML = '';
  if (activeSession.exercises.length === 0) {
    exercisesContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:8px;">Inga övningar ännu. Lägg till en nedan.</p>';
    return;
  }

  activeSession.exercises.forEach((ex, exIdx) => {
    const card = document.createElement('div');
    card.className = 'exercise-card';

    // Header
    const header = document.createElement('div');
    header.className = 'exercise-card-header';
    header.innerHTML = `
      <span>${ex.name}</span>
      <button class="btn-danger" onclick="removeExercise(${exIdx})">Ta bort</button>
    `;
    card.appendChild(header);

    // Sets table
    if (ex.sets.length > 0) {
      const table = document.createElement('table');
      table.className = 'sets-table';
      table.innerHTML = `
        <thead>
          <tr>
            <th>Set</th>
            <th>Reps</th>
            <th>Vikt (kg)</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${ex.sets.map((s, sIdx) => `
            <tr class="set-row">
              <td>${sIdx + 1}</td>
              <td>${s.reps}</td>
              <td>${s.weight > 0 ? s.weight + ' kg' : '—'}</td>
              <td><button class="btn-danger" style="padding:3px 8px;" onclick="removeSet(${exIdx},${sIdx})">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      `;
      card.appendChild(table);
    }

    // Add set row
    const addRow = document.createElement('div');
    addRow.className = 'add-set-row';
    addRow.innerHTML = `
      <input type="number" id="reps-${exIdx}" placeholder="Reps" min="0" style="width:80px;" />
      <input type="number" id="weight-${exIdx}" placeholder="Vikt kg" min="0" step="0.5" style="width:90px;" />
      <button class="btn-icon" onclick="addSet(${exIdx})">+ Set</button>
    `;
    // Allow Enter key on weight input to add set
    addRow.querySelectorAll('input');
    card.appendChild(addRow);

    // Enter key on inputs inside this card
    card.querySelectorAll('input[type="number"]').forEach(inp => {
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') addSet(exIdx); });
    });

    exercisesContainer.appendChild(card);
  });
}

function saveSession() {
  if (!activeSession) return;
  // Remove exercises with no sets (optional: keep them)
  const toSave = {
    id: Date.now(),
    name: activeSession.name,
    date: activeSession.date,
    exercises: activeSession.exercises.filter(e => e.sets.length > 0 || true) // keep all
  };
  sessions.unshift(toSave);
  persist();
  renderHistory();
  cancelSession();
  showToast('Pass sparat!');
}

function deleteSession(id) {
  sessions = sessions.filter(s => s.id !== id);
  persist();
  renderHistory();
  showToast('Pass borttaget');
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
}

function renderHistory() {
  historyList.innerHTML = '';
  const count = sessions.length;
  historyCount.textContent = count === 0 ? '' : `${count} pass`;

  if (count === 0) {
    historyList.innerHTML = `
      <div class="empty">
        <span>🏋️</span>
        Inga sparade pass ännu.<br/>Starta ett nytt pass ovan!
      </div>
    `;
    return;
  }

  sessions.forEach(session => {
    const totalSets = session.exercises.reduce((acc, e) => acc + e.sets.length, 0);
    const exNames = session.exercises.map(e => e.name).join(', ') || 'Inga övningar';

    const item = document.createElement('div');
    item.className = 'history-item';
    item.dataset.id = session.id;

    item.innerHTML = `
      <div class="history-item-header" onclick="toggleHistory(${session.id})">
        <div class="left">
          <h3>${session.name}</h3>
          <span>${formatDate(session.date)} · ${session.exercises.length} övningar · ${totalSets} set</span>
        </div>
        <div class="right">
          <button class="btn-danger" style="padding:5px 10px;" onclick="event.stopPropagation(); deleteSession(${session.id})">Ta bort</button>
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="history-body">
        ${session.exercises.length === 0
          ? '<p style="color:var(--text-muted); font-size:0.85rem; padding:10px 0;">Inga övningar loggade.</p>'
          : session.exercises.map(ex => `
              <div class="history-exercise">
                <div class="history-exercise-name">${ex.name}</div>
                <div class="history-sets">
                  ${ex.sets.length === 0
                    ? '<span style="color:var(--text-muted); font-size:0.8rem;">Inga set</span>'
                    : ex.sets.map((s, i) => `
                        <span class="set-pill">Set ${i+1}: <strong>${s.reps} reps</strong>${s.weight > 0 ? ` · <strong>${s.weight} kg</strong>` : ''}</span>
                      `).join('')
                  }
                </div>
              </div>
            `).join('')
        }
      </div>
    `;
    historyList.appendChild(item);
  });
}

function toggleHistory(id) {
  const el = historyList.querySelector(`[data-id="${id}"]`);
  if (el) el.classList.toggle('open');
}

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}
</script>
</body>
</html>
