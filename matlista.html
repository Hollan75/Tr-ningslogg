<title>Veckans Mat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* ── TOKENS ─── dark-first, cool slate + single indigo accent ─────────── */
:root {
  --bg:   #0e0e14; --s1: #16161e; --s2: #1c1c28; --bd: #26263a;
  --t1:   #eeeef8; --t2: #72729a;
  --ac:   #6b6de8; --ac-d: rgba(107,109,232,.14);
  --gn:   #2dd484; --gn-d: rgba(45,212,132,.11);
  --rd:   #ff5252; --rd-d: rgba(255,82,82,.12);
  --am:   #f5a623; --am-d: rgba(245,166,35,.13);
  --r: 12px; color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #edeef4; --s1: #fff; --s2: #e6e7f0; --bd: #cccde0;
    --t1: #111120; --t2: #6062a0;
    --ac: #4446cc; --ac-d: rgba(68,70,204,.10);
    --gn: #0a9e60; --gn-d: rgba(10,158,96,.10);
    --rd: #cc2020; --rd-d: rgba(204,32,32,.10);
    --am: #d4820a; --am-d: rgba(212,130,10,.12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #edeef4; --s1: #fff; --s2: #e6e7f0; --bd: #cccde0;
  --t1: #111120; --t2: #6062a0;
  --ac: #4446cc; --ac-d: rgba(68,70,204,.10);
  --gn: #0a9e60; --gn-d: rgba(10,158,96,.10);
  --rd: #cc2020; --rd-d: rgba(204,32,32,.10);
  --am: #d4820a; --am-d: rgba(212,130,10,.12);
  color-scheme: light;
}
.d0{--da:#6b6de8} .d1{--da:#9b6fd8} .d2{--da:#2dd484}
.d3{--da:#5ab4e8} .d4{--da:#e87060} .d5{--da:#e8c060} .d6{--da:#de7fbf}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--t1);
  font-family:'Outfit',system-ui,-apple-system,sans-serif;
  min-height:100%;padding-bottom:80px;font-size:15px;
}
button{cursor:pointer;font-family:inherit;transition:.12s all}

.hdr{
  background:var(--s1);border-bottom:1px solid var(--bd);
  padding:12px 18px;display:flex;align-items:center;gap:12px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
}
.hdr-info{flex:1}
.hdr-info h1{font-size:1.05rem;font-weight:700;letter-spacing:-.3px}
.hdr-sub{font-size:.72rem;color:var(--t2);margin-top:1px}
.chip{font-size:.65rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.7px}
.chip-p{background:var(--ac-d);color:var(--ac)}
.chip-c{background:var(--gn-d);color:var(--gn)}

.wnav{
  background:var(--s1);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;padding:10px 18px;
}
.wnav-lbl{font-size:.85rem;font-weight:600}
.wnav-btn{
  background:var(--s2);border:1px solid var(--bd);color:var(--t1);
  width:32px;height:32px;border-radius:50%;font-size:.95rem;
  display:flex;align-items:center;justify-content:center;
}
.wnav-btn:hover{background:var(--bd)}


.cnt{max-width:680px;margin:0 auto;padding:14px 16px}

.name-row{
  background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);
  padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.name-row label{font-size:.8rem;color:var(--t2);white-space:nowrap}
.name-inp{
  flex:1;min-width:0;background:var(--s2);border:1px solid var(--bd);
  border-radius:7px;padding:7px 11px;font-size:.88rem;font-family:inherit;color:var(--t1);
}
.name-inp:focus{outline:none;border-color:var(--ac)}

.dc{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.dc-strip{height:2px;background:var(--da)}
.dc-head{padding:10px 16px 8px;display:flex;align-items:baseline;gap:8px}
.dc-name{font-weight:700;font-size:.92rem}
.dc-date{font-size:.72rem;color:var(--t2)}
.dc-vc{margin-left:auto;font-size:.7rem;color:var(--t2)}
.dc-body{padding:0 16px 12px}

.ml{list-style:none}
.mi{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.mi:last-child{border-bottom:none}
.mi-name{flex:1;min-width:0;font-size:.88rem}
.mi-by{font-size:.68rem;color:var(--t2);white-space:nowrap}
.mi-vc{font-size:.68rem;color:var(--gn);background:var(--gn-d);padding:2px 7px;border-radius:20px;white-space:nowrap}
.mi-vd{font-size:.68rem;color:var(--rd);background:var(--rd-d);padding:2px 7px;border-radius:20px;white-space:nowrap}
.mi-voters{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:4px;padding:2px 0 2px 38px}
.mi-voter{font-size:.66rem;padding:2px 8px;border-radius:20px;background:var(--gn-d);border:1px solid var(--gn);color:var(--gn)}
.mi-dvoter{font-size:.66rem;padding:2px 8px;border-radius:20px;background:var(--rd-d);border:1px solid var(--rd);color:var(--rd)}

/* vote buttons */
.vbtn{
  width:30px;height:30px;border-radius:50%;border:1.5px solid var(--bd);background:none;
  display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--t2);flex-shrink:0;
}
.vbtn:hover{border-color:var(--gn);color:var(--gn);background:var(--gn-d)}
.vbtn.on{background:var(--gn);border-color:var(--gn);color:#0e0e14}
.vbtn-d{
  width:30px;height:30px;border-radius:50%;border:1.5px solid var(--bd);background:none;
  display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--t2);flex-shrink:0;
}
.vbtn-d:hover{border-color:var(--rd);color:var(--rd);background:var(--rd-d)}
.vbtn-d.on{background:var(--rd);border-color:var(--rd);color:#fff}

.dbtn{width:26px;height:26px;border:none;background:none;color:var(--t2);font-size:.72rem;border-radius:5px;flex-shrink:0}
.dbtn:hover{color:var(--rd)}

.ar{display:flex;gap:7px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
.ar-inp{
  flex:1;min-width:0;background:var(--s2);border:1px solid var(--bd);
  border-radius:7px;padding:7px 10px;font-size:.84rem;font-family:inherit;color:var(--t1);
}
.ar-inp:focus{outline:none;border-color:var(--ac)}
.ar-inp::placeholder{color:var(--t2)}

.btn{font-size:.8rem;font-weight:600;padding:7px 13px;border-radius:7px;border:none;white-space:nowrap}
.btn-a{background:var(--ac);color:#fff}
.btn-g{background:var(--s2);border:1px solid var(--bd);color:var(--t2)}
.btn-a:hover{opacity:.9}
.btn-g:hover{color:var(--t1)}
.btn-am{background:var(--am-d);border:1px solid var(--am);color:var(--am)}
.btn-am:hover{opacity:.9}
.btn-sm{padding:5px 10px;font-size:.74rem}

.spbtn{
  font-size:.73rem;font-weight:600;padding:5px 10px;border-radius:20px;
  border:1px solid var(--bd);background:var(--s2);color:var(--t2);white-space:nowrap;flex-shrink:0;
}
.spbtn:hover{border-color:var(--ac);color:var(--ac)}
.spbtn.open{border-color:var(--ac);color:var(--ac);background:var(--ac-d)}

/* ── SUGGESTION PANEL ────────────────────────────────────────────────── */
.sppanel{margin-top:7px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px}
.sppanel-lbl{font-size:.68rem;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.sppills{display:flex;flex-wrap:wrap;gap:5px}
.sppill{
  font-family:inherit;font-size:.76rem;padding:5px 12px;border-radius:20px;
  border:1px solid var(--bd);background:var(--s1);color:var(--t1);
}
.sppill:hover{border-color:var(--ac);color:var(--ac)}
.sppill.lib{border-color:var(--am);color:var(--am)}
.sppill.lib:hover{background:var(--am-d)}
.spp-fler{
  font-family:inherit;font-size:.72rem;font-weight:600;padding:4px 10px;
  border-radius:20px;border:1px solid var(--bd);background:none;color:var(--t2);margin-top:6px;
}
.spp-fler:hover{border-color:var(--ac);color:var(--ac)}

/* import section inside panel */
.spp-sec{border-top:1px dashed var(--bd);margin-top:10px;padding-top:10px}
.spp-row{display:flex;gap:6px;margin-top:5px}
.spp-inp{
  flex:1;min-width:0;background:var(--s1);border:1px solid var(--bd);
  border-radius:6px;padding:6px 9px;font-size:.8rem;font-family:inherit;color:var(--t1);
}
.spp-inp:focus{outline:none;border-color:var(--ac)}
.spp-inp::placeholder{color:var(--t2)}
.spp-ta{width:100%;min-height:68px;resize:vertical}

/* library section */
.lib-list{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:200px;overflow-y:auto}
.lib-item{
  display:flex;align-items:center;gap:8px;padding:5px 8px;
  background:var(--s1);border:1px solid var(--bd);border-radius:7px;
}
.lib-item-name{flex:1;font-size:.82rem;min-width:0}
.lib-add{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid var(--am);background:var(--am-d);color:var(--am)}
.lib-add:hover{opacity:.85}
.lib-del{font-size:.7rem;background:none;border:none;color:var(--t2);padding:2px 4px}
.lib-del:hover{color:var(--rd)}

.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--t2);font-size:.9rem}
.err-box{
  margin:40px auto;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);
  padding:28px 24px;text-align:center;max-width:480px;
}
.err-box h2{font-size:1.1rem;margin-bottom:8px}
.err-box p{font-size:.85rem;color:var(--t2);line-height:1.5}

#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(6px);
  background:var(--t1);color:var(--bg);font-size:.8rem;font-weight:600;
  padding:8px 18px;border-radius:20px;opacity:0;pointer-events:none;z-index:400;
  transition:all .2s;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.ac-wrap{flex:1;min-width:0;position:relative}
.ac-drop{
  position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:100;
  background:var(--s1);border:1px solid var(--bd);border-radius:8px;
  box-shadow:0 6px 20px rgba(0,0,0,.3);overflow:hidden;
}
.ac-item{
  padding:8px 12px;font-size:.84rem;cursor:pointer;
  border-bottom:1px solid var(--bd);transition:.08s background;
}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.focused{background:var(--s2);color:var(--ac)}
.ac-item.lib{color:var(--am)}
.ac-item.lib:hover,.ac-item.lib.focused{background:var(--am-d);color:var(--am)}
.meal-sec-lbl{
  font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  color:var(--t2);padding:7px 0 3px;border-top:1px solid var(--bd);margin-top:2px;
}
.meal-sec-lbl:first-child{border-top:none;padding-top:2px;margin-top:0}

.mbtn{width:26px;height:26px;border:none;background:none;color:var(--t2);font-size:.8rem;border-radius:5px;flex-shrink:0}
.mbtn:hover{color:var(--ac)}
.mbtn.on{color:var(--ac)}
.move-picker{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:4px;padding:4px 0 2px 34px}
.move-day{
  font-family:inherit;font-size:.7rem;font-weight:600;padding:3px 9px;
  border-radius:20px;border:1px solid var(--bd);background:var(--s2);color:var(--t2);
}
.move-day:not(:disabled):hover{border-color:var(--ac);color:var(--ac);background:var(--ac-d)}
.move-day:disabled{opacity:.35;cursor:default}

/* star ratings */
.mi-stars{flex:0 0 100%;display:flex;align-items:center;gap:1px;padding:3px 0 2px 34px}
.star-btn{background:none;border:none;font-size:.88rem;color:var(--bd);padding:2px 1px;line-height:1;cursor:pointer;transition:.08s color}
.star-btn:hover,.star-btn.on{color:var(--am)}
.mi-avg{font-size:.64rem;color:var(--t2);margin-left:5px}
@media (max-width:480px){.cnt{padding:12px 12px}}
</style>

<div class="loading" id="loading-screen">Laddar…</div>

<div id="main-app" hidden>
  <header class="hdr">
    <div class="hdr-info">
      <h1>Veckans Mat</h1>
      <p class="hdr-sub" id="hdr-sub"></p>
    </div>
    <span class="chip" id="role-chip"></span>
  </header>
  <div class="wnav" id="week-nav" hidden>
    <button class="wnav-btn" id="prev-w">‹</button>
    <span class="wnav-lbl" id="wnav-lbl"></span>
    <button class="wnav-btn" id="next-w">›</button>
  </div>
  <div class="cnt">
    <div class="name-row" id="name-row" hidden>
      <label for="name-inp">Ditt namn:</label>
      <input type="text" id="name-inp" class="name-inp" placeholder="T.ex. Emma" maxlength="30" />
    </div>
    <div id="days-list"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── CONSTANTS ──────────────────────────────────────────────────────────
const DAYS = ['Onsdag','Torsdag','Fredag','Lördag','Söndag','Måndag','Tisdag'];

const MEALS = [
  'Köttbullar med potatismos','Tacos','Pannkakor med sylt och grädde',
  'Pasta Bolognese','Kycklinggryta med ris','Laxpasta med gräddsås',
  'Pytt i panna','Korv Stroganoff','Ärtsoppa','Fläskfilé med gräddsås',
  'Lasagne','Hemgjord pizza','Hamburgare','Fiskpinnar med potatismos',
  'Spaghetti Carbonara','Kyckling i ugn med rotfrukter',
  'Falukorv med stuvad makaroni','Ugnspannkaka med bacon',
  'Pannbiff med lök','Chili con carne','Kycklingwraps',
  'Stekt strömming med potatismos','Wallenbergare',
  'Potatisgratäng med fläsk','Schnitzel med coleslaw',
  'Lax i ugn med dillsås','Curry med kyckling','Falafel med pitabröd',
  'Köttfärssås med pasta','Biff med bearnaisesås',
  'Kalops med inlagda rödbetor','Janssons frestelse',
  'Paj med kyckling och purjolök','Laxgratäng',
];

// ── HELPERS ────────────────────────────────────────────────────────────
function uid()  { return Math.random().toString(36).slice(2,9) }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}
function isoDate(d) {
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),
        dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function getWednesday(d) {
  // Wed(3)=0, Thu(4)=-1, Fri(5)=-2, Sat(6)=-3, Sun(0)=-4
  // Mon(1)=+2, Tue(2)=+1  ← Mon/Tue jump forward to next Wed (plan ahead)
  const r=new Date(d);
  const diff={0:-4,1:2,2:1,3:0,4:-1,5:-2,6:-3}[r.getDay()];
  r.setDate(r.getDate()+diff); r.setHours(12,0,0,0); return r;
}
function addDays(d,n) { const r=new Date(d); r.setDate(r.getDate()+n); return r }
function weekNum(d) {
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=dt.getUTCDay()||7; dt.setUTCDate(dt.getUTCDate()+4-day);
  const yr=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil(((dt-yr)/86400000+1)/7);
}
function svDate(iso) {
  const [,m,d]=iso.split('-');
  return `${parseInt(d)} ${['jan','feb','mar','apr','maj','jun',
    'jul','aug','sep','okt','nov','dec'][parseInt(m)-1]}`;
}
function makePlan(ws) {
  const mon=new Date(ws+'T12:00:00');
  return {weekStart:ws, days:DAYS.map((name,i)=>({
    idx:i, name, date:isoDate(addDays(mon,i)), meals:[]
  }))};
}
function extractNameFromUrl(url) {
  try {
    const u=new URL(url.trim().startsWith('http')?url.trim():'https://'+url.trim());
    const segs=u.pathname.split('/').filter(s=>s&&s.length>2&&!/^\d+$/.test(s));
    const last=segs[segs.length-1]; if(!last) return null;
    return last.replace(/[-_]/g,' ').replace(/\s+/g,' ').trim()
      .replace(/\b\w/g,c=>c.toUpperCase());
  } catch { return null; }
}

// ── STATE ──────────────────────────────────────────────────────────────
let db=null, userCap=null;
let myId=null, myName='', isOwner=false;
let weekStart=isoDate(getWednesday(new Date()));
let plan=null;
let allVotes={};   // { userId: { name, w_YYYY-MM-DD: { picks, downs, suggestions } } }
let library=[];    // [{ id, name }] from db 'library' collection
let planUnsub=null, votesUnsub=null, libUnsub=null;
let openSugPanel=null; // dayIdx or null
let openSugType='middag'; // 'lunch'|'middag' for Sat/Sun panels
let movingMeal=null;  // {di, id} or null
let allRatings={};  // { mealSlug: { name, ratings: { userId: score } } }
let ratingsUnsub=null;

// ── TOAST ──────────────────────────────────────────────────────────────
let toastT;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2500);
}

// ── INIT ───────────────────────────────────────────────────────────────
async function init() {
  try {
    [db,userCap]=await Promise.all([window.claude?.use('db'),window.claude?.use('user')]);
  } catch {}
  if (!db) {
    document.getElementById('loading-screen').innerHTML=`
      <div class="err-box"><h2>Öppna via delad länk</h2>
      <p>Be föräldern skicka den delade Claude-länken.</p></div>`;
    return;
  }

  const me=await userCap?.me()??{};
  myId=me.id??null; isOwner=me.isOwner??false;

  if (myId&&!isOwner) {
    try {
      const snap=await db.collection('votes').doc(myId).get();
      if (snap.exists) myName=snap.data().name||'';
    } catch {}
    const ni=document.getElementById('name-inp');
    ni.value=myName;
    ni.addEventListener('change',e=>{ myName=e.target.value.trim(); saveVoteName(); });
    document.getElementById('name-row').hidden=false;
  }

  const chip=document.getElementById('role-chip');
  chip.textContent=isOwner?'Förälder':'Barn';
  chip.className='chip '+(isOwner?'chip-p':'chip-c');

  if (isOwner) {
    document.getElementById('week-nav').hidden=false;
    document.getElementById('prev-w').addEventListener('click',()=>changeWeek(-7));
    document.getElementById('next-w').addEventListener('click',()=>changeWeek(7));
  }

  // Library subscription (all roles can see, parent can manage)
  libUnsub=db.collection('library').onSnapshot(snap=>{
    library=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>a.name.localeCompare(b.name,'sv'));
    render();
  });

  // Ratings subscription (all roles)
  ratingsUnsub=db.collection('ratings').onSnapshot(snap=>{
    allRatings={};
    snap.docs.forEach(d=>{ allRatings[d.id]=d.data(); });
    render();
  });

  subscribeWeek();
  document.getElementById('loading-screen').hidden=true;
  document.getElementById('main-app').hidden=false;
}

// ── SUBSCRIPTIONS ──────────────────────────────────────────────────────
function subscribeWeek() {
  if (planUnsub) planUnsub();
  if (votesUnsub) votesUnsub();
  updateWeekLabel();

  planUnsub=db.collection('plans').doc(weekStart).onSnapshot(snap=>{
    if (snap.exists) { plan=snap.data(); }
    else {
      plan=makePlan(weekStart);
      if (isOwner) db.collection('plans').doc(weekStart).set(plan).catch(()=>{});
    }
    render();
  });

  votesUnsub=db.collection('votes').onSnapshot(snap=>{
    allVotes={}; snap.docs.forEach(d=>{ allVotes[d.id]=d.data(); }); render();
  });
}

function updateWeekLabel() {
  const mon=new Date(weekStart+'T12:00:00');
  const lbl=`Vecka ${weekNum(mon)} · ${svDate(weekStart)}–${svDate(isoDate(addDays(mon,6)))}`;
  document.getElementById('wnav-lbl').textContent=lbl;
  document.getElementById('hdr-sub').textContent=lbl;
}

function changeWeek(delta) {
  const mon=new Date(weekStart+'T12:00:00'); mon.setDate(mon.getDate()+delta);
  weekStart=isoDate(mon); openSugPanel=null; openSugType='middag'; movingMeal=null; subscribeWeek();
}

// ── DERIVED ────────────────────────────────────────────────────────────
function wk() { return `w_${weekStart}`; }

function getAllMeals(dayIdx) {
  const base=plan?.days?.[dayIdx]?.meals??[];
  const sugs=[];
  Object.entries(allVotes).forEach(([,v])=>{
    const ds=(v[wk()]?.suggestions??{})[dayIdx]??[];
    ds.forEach(s=>sugs.push({...s,by:v.name||'Barn'}));
  });
  return {base,sugs};
}

function voteCount(mealId) {
  return Object.values(allVotes).filter(v=>!!(v[wk()]?.picks?.[mealId])).length;
}
function downCount(mealId) {
  return Object.values(allVotes).filter(v=>!!(v[wk()]?.downs?.[mealId])).length;
}
function netScore(mealId) { return voteCount(mealId)-downCount(mealId); }
function iVoted(mealId)    { return !!(allVotes[myId]?.[wk()]?.picks?.[mealId]); }
function iDownvoted(mealId){ return !!(allVotes[myId]?.[wk()]?.downs?.[mealId]); }

function voterNames(mealId) {
  return Object.values(allVotes).filter(v=>!!(v[wk()]?.picks?.[mealId])).map(v=>v.name||'Barn');
}
function dvoterNames(mealId) {
  return Object.values(allVotes).filter(v=>!!(v[wk()]?.downs?.[mealId])).map(v=>v.name||'Barn');
}

// ── RATINGS ────────────────────────────────────────────────────────────
// Per-user docs (like votes): allRatings = { userId: { ratings: { slug: score } } }
function mealSlug(name) {
  return name.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0,80)||'meal';
}
function avgRating(name) {
  const slug=mealSlug(name);
  const vals=Object.values(allRatings).map(u=>u?.ratings?.[slug]??0).filter(v=>v>0);
  return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0;
}
function myRating(name) {
  if(!myId) return 0;
  return allRatings[myId]?.ratings?.[mealSlug(name)]??0;
}
function ratingCount(name) {
  const slug=mealSlug(name);
  return Object.values(allRatings).filter(u=>(u?.ratings?.[slug]??0)>0).length;
}
async function rateRecipe(name,score) {
  if(!myId){toast('Inte inloggad');return;}
  const slug=mealSlug(name);
  const ex=allRatings[myId]??{};
  const cur=(ex.ratings??{})[slug]??0;
  const newScore=cur===score?0:score;  // same star again = remove rating
  const newRatings={...(ex.ratings??{}),[slug]:newScore};
  try {
    await db.collection('ratings').doc(myId).set({...ex,ratings:newRatings});
    // Auto-save to library if avg >= 3.5 with >= 2 raters (computed from current state + this write)
    const otherVals=Object.entries(allRatings)
      .filter(([uid])=>uid!==myId)
      .map(([,u])=>u?.ratings?.[slug]??0)
      .filter(v=>v>0);
    const myVals=newScore>0?[newScore]:[];
    const allVals=[...otherVals,...myVals];
    if(allVals.length>=2) {
      const avg=allVals.reduce((s,v)=>s+v,0)/allVals.length;
      if(avg>=3.5&&!library.some(l=>l.name.toLowerCase()===name.toLowerCase())) {
        await addToLibrary(name);
        toast(`"${name}" sparades i biblioteket! ⭐`);
      }
    }
  } catch(e) { toast('Kunde inte betygsätta'); }
}
function mkStarsRow(meal) {
  const row=document.createElement('div'); row.className='mi-stars';
  const mr=myRating(meal.name);
  for(let i=1;i<=5;i++){
    const b=document.createElement('button'); b.className='star-btn'+(mr>=i?' on':'');
    b.textContent='★'; b.title=`${i} stjärna${i>1?'r':''}`;
    b.addEventListener('click',()=>rateRecipe(meal.name,i));
    row.appendChild(b);
  }
  const avg=avgRating(meal.name);
  if(avg>0){
    const s=document.createElement('span'); s.className='mi-avg';
    s.textContent=`${avg.toFixed(1)} (${ratingCount(meal.name)})`;
    row.appendChild(s);
  }
  return row;
}

// ── RENDER ─────────────────────────────────────────────────────────────
function render() { if (!plan) return; isOwner?renderParent():renderChild(); }

function filterByType(meals,mt) {
  return mt==='lunch'?meals.filter(m=>m.type==='lunch'):meals.filter(m=>!m.type||m.type!=='lunch');
}

// Builds one meal-type section and appends it to body
function appendMealSection(body,di,base,sugs,mealType,isParent,showLabel) {
  const bm=filterByType(base,mealType), sm=filterByType(sugs,mealType);
  if (showLabel) {
    const lbl=document.createElement('div'); lbl.className='meal-sec-lbl';
    lbl.textContent=mealType==='lunch'?'Lunch':'Middag';
    body.appendChild(lbl);
  }
  const ul=document.createElement('ul'); ul.className='ml';
  if (isParent) {
    if (!bm.length&&!sm.length) ul.innerHTML=`<li style="font-size:.8rem;color:var(--t2);padding:6px 0;font-style:italic">Inga rätter ännu</li>`;
    bm.forEach(meal=>{
      const vc=voteCount(meal.id); const vn=voterNames(meal.id);
      const isMoving=movingMeal?.di===di&&movingMeal?.id===meal.id;
      const li=document.createElement('li'); li.className='mi';
      li.innerHTML=`
        <button class="mbtn${isMoving?' on':''}" data-di="${di}" data-id="${meal.id}" title="Flytta">⇄</button>
        <span class="mi-name">${esc(meal.name)}</span>
        ${vc>0?`<span class="mi-vc">${vc} ✓</span>`:''}
        <button class="dbtn" data-di="${di}" data-id="${meal.id}" title="Ta bort">✕</button>`;
      if (vn.length) {
        const vrow=document.createElement('div'); vrow.className='mi-voters';
        vn.forEach(n=>{const c=document.createElement('span');c.className='mi-voter';c.textContent=n;vrow.appendChild(c);});
        li.appendChild(vrow);
      }
      if (isMoving) {
        const picker=document.createElement('div'); picker.className='move-picker';
        DAYS.forEach((dname,tdi)=>{
          const btn=document.createElement('button'); btn.className='move-day';
          btn.textContent=dname.slice(0,3); btn.title=dname;
          if(tdi===di) btn.disabled=true; else btn.addEventListener('click',()=>moveMeal(di,meal.id,tdi));
          picker.appendChild(btn);
        });
        li.appendChild(picker);
      }
      li.appendChild(mkStarsRow(meal));
      ul.appendChild(li);
    });
    sm.forEach(sug=>{
      const vc=voteCount(sug.id); const vn=voterNames(sug.id);
      const li=document.createElement('li'); li.className='mi';
      li.innerHTML=`<span style="font-size:.62rem;color:var(--t2);flex-shrink:0">↳</span>
        <span class="mi-name">${esc(sug.name)}</span>
        <span class="mi-by">${esc(sug.by)}</span>
        ${vc>0?`<span class="mi-vc">${vc} ✓</span>`:''}`;
      if (vn.length) {
        const vrow=document.createElement('div'); vrow.className='mi-voters';
        vn.forEach(n=>{const c=document.createElement('span');c.className='mi-voter';c.textContent=n;vrow.appendChild(c);});
        li.appendChild(vrow);
      }
      li.appendChild(mkStarsRow(sug));
      ul.appendChild(li);
    });
  } else {
    const allM=[...bm,...sm].sort((a,b)=>{const sa=netScore(a.id),sb=netScore(b.id);return sb!==sa?sb-sa:0;});
    if (!allM.length) ul.innerHTML=`<li style="font-size:.8rem;color:var(--t2);padding:6px 0;font-style:italic">Inga förslag ännu</li>`;
    allM.forEach(meal=>{
      const voted=iVoted(meal.id),downed=iDownvoted(meal.id);
      const vc=voteCount(meal.id),dc=downCount(meal.id);
      const li=document.createElement('li'); li.className='mi';
      li.style.opacity=(downed&&!voted)?'.55':'1';
      li.innerHTML=`
        <button class="vbtn${voted?' on':''}" data-di="${di}" data-id="${meal.id}" title="Rösta upp">✓</button>
        <span class="mi-name">${esc(meal.name)}</span>
        ${meal.by&&meal.by!=='Papa'?`<span class="mi-by">${esc(meal.by)}</span>`:''}
        ${vc>0?`<span class="mi-vc">${vc}</span>`:''}
        ${dc>0?`<span class="mi-vd">–${dc}</span>`:''}
        <button class="vbtn-d${downed?' on':''}" data-di="${di}" data-id="${meal.id}" title="Rösta ner">–</button>`;
      li.appendChild(mkStarsRow(meal));
      ul.appendChild(li);
    });
  }
  body.appendChild(ul);
  body.appendChild(mkAddRow(di,isParent,mealType));
  const sp=document.createElement('div'); sp.id=`sp-${di}-${mealType}`;
  if (openSugPanel===di&&openSugType===mealType) sp.appendChild(buildSugPanel(di,isParent,mealType));
  body.appendChild(sp);
}

function renderParent() {
  const list=document.getElementById('days-list'); list.innerHTML='';
  plan.days.forEach((day,di)=>{
    const {base,sugs}=getAllMeals(di);
    const totalV=[...base,...sugs].reduce((s,m)=>s+voteCount(m.id),0);
    const card=mkCard(di,day,totalV>0?`${totalV} röst${totalV!==1?'er':''}`:``);
    const body=card.querySelector('.dc-body');
    const isSatSun=di===3||di===4;
    if (isSatSun) {
      appendMealSection(body,di,base,sugs,'lunch',true,true);
      appendMealSection(body,di,base,sugs,'middag',true,true);
    } else {
      appendMealSection(body,di,base,sugs,'middag',true,false);
    }
    list.appendChild(card);
  });
  list.querySelectorAll('.mbtn').forEach(btn=>{btn.addEventListener('click',()=>toggleMovePicker(+btn.dataset.di,btn.dataset.id));});
  list.querySelectorAll('.dbtn').forEach(btn=>{btn.addEventListener('click',()=>deleteMeal(+btn.dataset.di,btn.dataset.id));});
}

function renderChild() {
  const list=document.getElementById('days-list'); list.innerHTML='';
  plan.days.forEach((day,di)=>{
    const {base,sugs}=getAllMeals(di);
    const card=mkCard(di,day,'');
    const body=card.querySelector('.dc-body');
    const isSatSun=di===3||di===4;
    if (isSatSun) {
      appendMealSection(body,di,base,sugs,'lunch',false,true);
      appendMealSection(body,di,base,sugs,'middag',false,true);
    } else {
      appendMealSection(body,di,base,sugs,'middag',false,false);
    }
    list.appendChild(card);
  });
  list.querySelectorAll('.vbtn').forEach(btn=>{btn.addEventListener('click',()=>toggleVote(+btn.dataset.di,btn.dataset.id));});
  list.querySelectorAll('.vbtn-d').forEach(btn=>{btn.addEventListener('click',()=>toggleDown(+btn.dataset.di,btn.dataset.id));});
}

function mkCard(di,day,vcLabel) {
  const card=document.createElement('div'); card.className=`dc d${di}`;
  card.innerHTML=`<div class="dc-strip"></div>
    <div class="dc-head">
      <span class="dc-name">${day.name}</span>
      <span class="dc-date">${svDate(day.date)}</span>
      ${vcLabel?`<span class="dc-vc">${vcLabel}</span>`:''}
    </div><div class="dc-body"></div>`;
  return card;
}

function mkAddRow(di,isParent,mealType='middag') {
  const ar=document.createElement('div'); ar.className='ar';
  const open=openSugPanel===di&&openSugType===mealType;
  function wireAc(inp,drop,onSelect,onEnter) {
    function show() {
      const q=inp.value.trim().toLowerCase(); if(!q){drop.hidden=true;return;}
      const taken=new Set((plan?.days?.[di]?.meals??[]).map(m=>m.name.toLowerCase()));
      const libM=library.filter(m=>!taken.has(m.name.toLowerCase())&&m.name.toLowerCase().includes(q));
      const mealM=MEALS.filter(m=>!taken.has(m.toLowerCase())&&m.toLowerCase().includes(q)&&!libM.some(l=>l.name.toLowerCase()===m.toLowerCase()));
      const all=[...libM.map(m=>({name:m.name,lib:true})),...mealM.map(m=>({name:m,lib:false}))].slice(0,8);
      if(!all.length){drop.hidden=true;return;}
      drop.innerHTML='';
      all.forEach(item=>{
        const row=document.createElement('div');
        row.className='ac-item'+(item.lib?' lib':'');
        row.textContent=item.name;
        row.addEventListener('mousedown',e=>{e.preventDefault();onSelect(item.name);inp.value='';drop.hidden=true;});
        drop.appendChild(row);
      });
      drop.hidden=false;
    }
    inp.addEventListener('input',show);
    inp.addEventListener('blur',()=>setTimeout(()=>{drop.hidden=true;},150));
    inp.addEventListener('keydown',e=>{
      if(e.key==='Escape'){drop.hidden=true;return;}
      if(!drop.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
        e.preventDefault();
        const items=[...drop.querySelectorAll('.ac-item')];
        const cur=drop.querySelector('.ac-item.focused');
        let idx=items.indexOf(cur);
        if(e.key==='ArrowDown') idx=Math.min(idx+1,items.length-1); else idx=Math.max(idx-1,0);
        if(cur) cur.classList.remove('focused');
        items[idx]?.classList.add('focused');
        inp.value=items[idx]?.textContent??inp.value;
        return;
      }
      if(e.key==='Enter'){onEnter();drop.hidden=true;}
    });
  }
  if (isParent) {
    const pid=`pai-${di}-${mealType}`, did=`ac-${di}-${mealType}`;
    ar.innerHTML=`
      <div class="ac-wrap">
        <input type="text" class="ar-inp" id="${pid}" placeholder="Lägg till rätt…" maxlength="60" autocomplete="off" />
        <div class="ac-drop" id="${did}" hidden></div>
      </div>
      <button class="btn btn-a btn-sm" data-di="${di}" data-mt="${mealType}" data-role="add">+</button>
      <button class="spbtn${open?' open':''}" data-di="${di}" data-mt="${mealType}" data-role="sug">Förslag</button>`;
    const inp=ar.querySelector(`#${pid}`), drop=ar.querySelector(`#${did}`);
    wireAc(inp,drop,name=>addMeal(di,name,mealType),()=>addMeal(di,null,mealType));
    ar.querySelector('[data-role="add"]').addEventListener('click',e=>{addMeal(+e.target.dataset.di,null,e.target.dataset.mt);drop.hidden=true;});
    ar.querySelector('[data-role="sug"]').addEventListener('click',e=>toggleSugPanel(+e.target.dataset.di,e.target.dataset.mt));
  } else {
    const cid=`ci-${di}-${mealType}`, cdid=`acc-${di}-${mealType}`;
    ar.innerHTML=`
      <div class="ac-wrap">
        <input type="text" class="ar-inp" id="${cid}" placeholder="Eget förslag…" maxlength="60" autocomplete="off" />
        <div class="ac-drop" id="${cdid}" hidden></div>
      </div>
      <button class="btn btn-g btn-sm" data-di="${di}" data-mt="${mealType}" data-role="add">+ Förslag</button>
      <button class="spbtn${open?' open':''}" data-di="${di}" data-mt="${mealType}" data-role="sug">Lista</button>`;
    const inp=ar.querySelector(`#${cid}`), drop=ar.querySelector(`#${cdid}`);
    wireAc(inp,drop,name=>addSuggestion(di,name,mealType),()=>addSuggestion(di,null,mealType));
    ar.querySelector('[data-role="add"]').addEventListener('click',e=>{addSuggestion(+e.target.dataset.di,null,e.target.dataset.mt);drop.hidden=true;});
    ar.querySelector('[data-role="sug"]').addEventListener('click',e=>toggleSugPanel(+e.target.dataset.di,e.target.dataset.mt));
  }
  return ar;
}

function toggleSugPanel(di,type='middag') {
  if(openSugPanel===di&&openSugType===type){openSugPanel=null;openSugType='middag';}
  else{openSugPanel=di;openSugType=type;}
  render();
}

// ── SUGGESTION PANEL ───────────────────────────────────────────────────
function buildSugPanel(di,isParent,mealType='middag') {
  const {base,sugs}=getAllMeals(di);
  const taken=new Set([...base,...sugs].map(m=>m.name.toLowerCase()));
  const avail=MEALS.filter(m=>!taken.has(m.toLowerCase()));
  const picks=avail.sort(()=>Math.random()-.5).slice(0,8);
  const spKey=`sp-${di}-${mealType}`;

  const panel=document.createElement('div'); panel.className='sppanel';
  panel.innerHTML=`<div class="sppanel-lbl">Snabbförslag</div>`;
  const pills=document.createElement('div'); pills.className='sppills';
  picks.forEach(name=>{
    const btn=document.createElement('button'); btn.className='sppill';
    btn.textContent=name;
    btn.addEventListener('click',()=>{ addByName(di,isParent,name,mealType); openSugPanel=null; });
    pills.appendChild(btn);
  });
  panel.appendChild(pills);

  const fler=document.createElement('button'); fler.className='spp-fler'; fler.textContent='Fler förslag →';
  fler.addEventListener('click',()=>{ const sp=document.getElementById(spKey); if(sp){sp.innerHTML='';sp.appendChild(buildSugPanel(di,isParent,mealType));} });
  panel.appendChild(fler);

  const libSec=document.createElement('div'); libSec.className='spp-sec';
  const libLbl=document.createElement('div'); libLbl.className='sppanel-lbl';
  libLbl.textContent='Bibliotek'+(isOwner?' — klicka för att lägga till':'');
  libSec.appendChild(libLbl);
  const libAvail=library.filter(m=>!taken.has(m.name.toLowerCase()))
    .sort((a,b)=>avgRating(b.name)-avgRating(a.name));
  if (!libAvail.length) {
    const emp=document.createElement('div');
    emp.style.cssText='font-size:.78rem;color:var(--t2);padding:4px 0;font-style:italic';
    emp.textContent='Biblioteket är tomt — importera rätter nedan';
    libSec.appendChild(emp);
  } else {
    const libList=document.createElement('div'); libList.className='lib-list';
    libAvail.forEach(item=>{
      const row=document.createElement('div'); row.className='lib-item';
      const avg=avgRating(item.name), cnt=ratingCount(item.name);
      const starStr=avg>0?` <span style="font-size:.66rem;color:var(--am)">★ ${avg.toFixed(1)}</span>`:'';
      row.innerHTML=`<span class="lib-item-name">${esc(item.name)}${starStr}</span>`;
      const addBtn=document.createElement('button'); addBtn.className='lib-add'; addBtn.textContent='Lägg till';
      addBtn.addEventListener('click',()=>{ addByName(di,isParent,item.name,mealType); openSugPanel=null; });
      row.appendChild(addBtn);
      if (isOwner) {
        const del=document.createElement('button'); del.className='lib-del'; del.textContent='✕';
        del.title='Ta bort från biblioteket';
        del.addEventListener('click',()=>removeFromLibrary(item.id));
        row.appendChild(del);
      }
      libList.appendChild(row);
    });
    libSec.appendChild(libList);
  }
  panel.appendChild(libSec);

  if (isOwner) {
    const k=`${di}-${mealType}`;
    const impSec=document.createElement('div'); impSec.className='spp-sec';
    impSec.innerHTML=`
      <div class="sppanel-lbl">Importera till biblioteket</div>
      <div style="font-size:.72rem;color:var(--t2);margin-bottom:4px">Klistra in en länk (t.ex. köket.se) eller skriv receptnamn, ett per rad</div>
      <div class="spp-row">
        <input type="text" class="spp-inp" id="url-inp-${k}" placeholder="https://www.koket.se/recept/…" />
        <button class="btn btn-am btn-sm" id="url-add-${k}">Lägg till</button>
      </div>
      <textarea class="spp-inp spp-ta" id="paste-inp-${k}"
                placeholder="Pasta Bolognese&#10;Köttbullar&#10;Tacos" style="margin-top:6px"></textarea>
      <button class="btn btn-am btn-sm" id="paste-add-${k}" style="margin-top:6px">Spara i biblioteket</button>`;
    impSec.querySelector(`#url-add-${k}`).addEventListener('click',()=>addFromUrl(di,mealType));
    impSec.querySelector(`#url-inp-${k}`).addEventListener('keydown',e=>{ if(e.key==='Enter') addFromUrl(di,mealType); });
    impSec.querySelector(`#paste-add-${k}`).addEventListener('click',()=>addFromPaste(di,mealType));
    panel.appendChild(impSec);
  }
  return panel;
}

// ── ACTIONS ────────────────────────────────────────────────────────────
async function addByName(di,isParent,name,mealType='middag') {
  if (isParent) await addMeal(di,name,mealType); else await addSuggestion(di,name,mealType);
}

async function addMeal(di,nameOverride,mealType='middag') {
  const inputId=`pai-${di}-${mealType}`;
  const name=nameOverride||(document.getElementById(inputId)?.value.trim());
  if (!name) return;
  if (!nameOverride) { const el=document.getElementById(inputId); if(el) el.value=''; }
  const newMeal={id:uid(),name,by:'Papa',type:mealType};
  const newDays=plan.days.map((d,i)=>i===di?{...d,meals:[...d.meals,newMeal]}:d);
  try { await db.collection('plans').doc(weekStart).update({days:newDays}); }
  catch { toast('Kunde inte spara'); }
}

function toggleMovePicker(di,id) {
  movingMeal=(movingMeal?.di===di&&movingMeal?.id===id)?null:{di,id};
  render();
}

async function moveMeal(fromDi,mealId,toDi) {
  const meal=plan.days[fromDi].meals.find(m=>m.id===mealId);
  if (!meal) return;
  const newDays=plan.days.map((d,i)=>{
    if (i===fromDi) return{...d,meals:d.meals.filter(m=>m.id!==mealId)};
    if (i===toDi)   return{...d,meals:[...d.meals,meal]};
    return d;
  });
  movingMeal=null;
  try { await db.collection('plans').doc(weekStart).update({days:newDays}); }
  catch { toast('Fel — försök igen'); }
}

async function deleteMeal(di,mealId) {
  const newDays=plan.days.map((d,i)=>i===di?{...d,meals:d.meals.filter(m=>m.id!==mealId)}:d);
  try { await db.collection('plans').doc(weekStart).update({days:newDays}); }
  catch { toast('Fel — försök igen'); }
}

async function addSuggestion(di,nameOverride,mealType='middag') {
  if (!myId) { toast('Inte inloggad'); return; }
  const inputId=`ci-${di}-${mealType}`;
  const name=nameOverride||(document.getElementById(inputId)?.value.trim());
  if (!name) return;
  if (!nameOverride) { const el=document.getElementById(inputId); if(el) el.value=''; }
  const sug={id:uid(),name,type:mealType};
  const ex=allVotes[myId]??{}, exw=ex[wk()]??{};
  const exs=exw.suggestions??{}, ds=exs[di]??[];
  const picks={...(exw.picks??{}),[sug.id]:true};
  try {
    await db.collection('votes').doc(myId).set({
      ...ex, name:myName||(ex.name||'Barn'),
      [wk()]:{...exw,picks,suggestions:{...exs,[di]:[...ds,sug]}}
    });
  } catch { toast('Fel'); }
}

async function toggleVote(di,mealId) {
  if (!myId) { toast('Inte inloggad'); return; }
  const ex=allVotes[myId]??{}, exw=ex[wk()]??{};
  const picks={...(exw.picks??{})};
  if (picks[mealId]) delete picks[mealId]; else picks[mealId]=true;
  try {
    await db.collection('votes').doc(myId).set({
      ...ex, name:myName||(ex.name||'Barn'), [wk()]:{...exw,picks}
    });
  } catch { toast('Fel'); }
}

async function toggleDown(di,mealId) {
  if (!myId) { toast('Inte inloggad'); return; }
  const ex=allVotes[myId]??{}, exw=ex[wk()]??{};
  const downs={...(exw.downs??{})};
  if (downs[mealId]) delete downs[mealId]; else downs[mealId]=true;
  // Can't both up and down vote
  const picks={...(exw.picks??{})};
  if (downs[mealId]&&picks[mealId]) delete picks[mealId];
  try {
    await db.collection('votes').doc(myId).set({
      ...ex, name:myName||(ex.name||'Barn'), [wk()]:{...exw,picks,downs}
    });
  } catch { toast('Fel'); }
}

async function addToLibrary(name) {
  const id=uid();
  try {
    await db.collection('library').doc(id).set({id,name,addedAt:Date.now()});
    toast(`"${name}" sparad i biblioteket`);
  } catch { toast('Kunde inte spara i biblioteket'); }
}

async function removeFromLibrary(id) {
  try { await db.collection('library').doc(id).delete(); }
  catch { toast('Fel'); }
}

async function addFromUrl(di,mealType='middag') {
  const inp=document.getElementById(`url-inp-${di}-${mealType}`);
  const url=inp.value.trim(); if (!url) return;
  const name=extractNameFromUrl(url);
  if (!name) { toast('Kunde inte tolka URL:en'); return; }
  inp.value='';
  await addToLibrary(name);
  await addMeal(di,name,mealType);
  openSugPanel=null;
}

async function addFromPaste(di,mealType='middag') {
  const ta=document.getElementById(`paste-inp-${di}-${mealType}`);
  const lines=ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if (!lines.length) return;
  ta.value='';
  for (const name of lines) await addToLibrary(name);
  toast(`${lines.length} rätt${lines.length!==1?'er':''} sparade i biblioteket`);
  openSugPanel=null;
}

async function saveVoteName() {
  if (!myId) return;
  const ex=allVotes[myId]??{};
  try { await db.collection('votes').doc(myId).set({...ex,name:myName}); } catch {}
}

// ── BOOT ───────────────────────────────────────────────────────────────
init();
</script>
